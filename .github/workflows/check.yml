name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 타입체크 + 유닛 테스트
      - run: npm run check
      # 아트 발주서와 manifest 가 어긋나면 화면이 회색 상자가 된다 — 여기서 잡는다
      - run: npm run art:check
      - run: npx vite build
