name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 타입체크 + 유닛 테스트
      - run: npm run check
      # 아트 발주서와 manifest 가 어긋나면 화면이 회색 상자가 된다 — 여기서 잡는다
      - run: npm run art:check
      - run: npx vite build

  smoke:
    # 실기기 해상도(390x844)로 실제 화면을 돌려 본다.
    # 미니게임 한 판(30초)과 프레임 측정이 들어 있어 5분쯤 걸린다 —
    # 개발 컨테이너에서는 끝까지 못 도는 경우가 있어서 여기서 돌린다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: preview 서버 띄우기
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo "preview 서버가 60초 안에 안 떴다"; exit 1
      - name: 스모크
        run: |
          mkdir -p shots
          OUT=shots node tools/smoke.mjs http://localhost:4173/
      - name: 스크린샷 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots/
          if-no-files-found: warn
